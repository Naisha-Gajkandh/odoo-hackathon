[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = flake8-bugbear
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # do not perform function calls in default arguments (DRF uses this pattern)
    "B904",  # raise from inside except — already handled in our code
]

[tool.ruff.lint.per-file-ignores]
# Migrations are auto-generated; ignore long lines and unused imports there
"*/migrations/*" = ["E501", "F401", "F811"]
# __init__ re-exports are fine
"*/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "analytics",
    "core",
    "drivers",
    "finance",
    "fleet",
    "maintenance",
    "trips",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
